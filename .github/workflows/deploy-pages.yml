name: Quality gate and GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# La puerta de calidad sólo lee. El permiso de escritura se concede
# exclusivamente al trabajo que publica, y sólo en main.
permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: npm ci

      - name: Quality gate
        run: npm run check

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7

  publish:
    needs: quality
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download build output
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Publish static site to gh-pages
        shell: bash
        run: |
          set -euo pipefail
          publish_dir="$(mktemp -d)"
          trap 'git worktree remove --force "$publish_dir" >/dev/null 2>&1 || true' EXIT
          git fetch origin gh-pages --depth=1
          git worktree add --detach "$publish_dir" FETCH_HEAD
          find "$publish_dir" -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf -- {} +
          cp -R dist/. "$publish_dir"/
          touch "$publish_dir/.nojekyll"
          git -C "$publish_dir" config user.name "github-actions[bot]"
          git -C "$publish_dir" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$publish_dir" add --all
          if git -C "$publish_dir" diff --cached --quiet; then
            exit 0
          fi
          git -C "$publish_dir" commit -m "deploy: ${GITHUB_SHA::12}"
          git -C "$publish_dir" push origin HEAD:gh-pages
