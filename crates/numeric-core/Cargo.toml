[package]
name = "fstructure-numeric-core"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
faer-backend = ["dep:faer", "dep:wasm-bindgen"]

[dependencies]
faer = { version = "=0.24.4", default-features = false, features = ["std", "sparse-linalg"], optional = true }
wasm-bindgen = { version = "=0.2.128", optional = true }
