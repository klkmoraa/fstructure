<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="description" content="FStructure · solver estructural 2D experimental" />
    <title>FStructure · Solver 2D</title>
    <!-- Favicons (Adaptive Vector & PNGs) -->
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="./favicon-32x32-dark.png" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/png" sizes="32x32" href="./favicon-32x32.png" media="(prefers-color-scheme: light)" />
    <link rel="icon" type="image/png" sizes="16x16" href="./favicon-16x16-dark.png" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/png" sizes="16x16" href="./favicon-16x16.png" media="(prefers-color-scheme: light)" />
    <link rel="shortcut icon" href="./favicon.ico" />

    <!-- Apple Touch Icon (Dark/Light mode support for iOS Home Screen & macOS Safari Add to Dock) -->
    <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon-dark.png" media="(prefers-color-scheme: dark)" />
    <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png" media="(prefers-color-scheme: light)" />
    <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png" id="dynamic-touch-icon" />

    <!-- Web App Manifest (Light & Dark) -->
    <link rel="manifest" href="./site.webmanifest" id="app-manifest" />

    <!-- Apple Web App & Theme configuration -->
    <meta name="apple-mobile-web-app-title" content="FStructure" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="theme-color" content="#fffefa" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#14171a" media="(prefers-color-scheme: dark)" />

    <script>
      (function() {
        function syncThemeAssets() {
          var isDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          var touchIcon = document.getElementById('dynamic-touch-icon');
          if (touchIcon) {
            touchIcon.href = isDark ? './apple-touch-icon-dark.png' : './apple-touch-icon.png';
          }
          var manifest = document.getElementById('app-manifest');
          if (manifest) {
            manifest.href = isDark ? './site-dark.webmanifest' : './site.webmanifest';
          }
        }
        syncThemeAssets();
        if (window.matchMedia) {
          window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', syncThemeAssets);
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
